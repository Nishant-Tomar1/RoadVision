name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes. Render free tier sleeps after 15 min of inactivity.
    - cron: '*/2 * * * *'
  workflow_dispatch:  # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          set -e
          URL="${{ secrets.BACKEND_URL }}/health"
          echo "Pinging $URL"
          # -f fails on HTTP errors, --max-time bounds the request,
          # --retry handles cold-start wakeups (free tier takes ~30s to wake)
          curl -fsSL --max-time 90 --retry 3 --retry-delay 10 \
               --retry-connrefused -o response.json -w "HTTP %{http_code} in %{time_total}s\n" \
               "$URL"
          cat response.json

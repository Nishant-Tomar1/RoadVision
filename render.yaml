services:
  - type: web
    name: pothole-detection-api
    env: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GPU_INFERENCE_URL
        sync: false           # paste your Colab+ngrok URL in the Render dashboard
      - key: CORS_ORIGINS
        sync: false           # set to your Vercel URL

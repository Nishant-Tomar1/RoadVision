services:
  - type: web
    name: pothole-detection-api
    env: python
    rootDir: backend
    plan: standard
    autoDeploy: true
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: model/best.pt
      - key: CONF_THRESHOLD
        value: "0.3"
      - key: IOU_THRESHOLD
        value: "0.5"
      - key: TRACKER
        value: bytetrack.yaml
      - key: CORS_ORIGINS
        value: "*"
